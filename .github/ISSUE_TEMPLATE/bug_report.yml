name: Bug report
description: Report something that doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please **do not** use
        this template for security vulnerabilities — see
        [SECURITY.md](../../SECURITY.md) for private reporting instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, in order.
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: How are you running BRUTE Runtime?
      options:
        - Installed app (NSIS/MSI installer)
        - Built from source (npm run tauri dev)
        - Built from source (npm run tauri build)
        - CLI (brute.exe) only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BRUTE Runtime version
      placeholder: "e.g. v0.1.0-beta.1"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: fresh-install
    attributes:
      label: Does this reproduce on a fresh install (or after Settings → Reset local state)?
      options:
        - "Yes"
        - "No"
        - "Haven't tried"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: >-
        Please review before pasting — do not include a full hardware
        report or exported library file without checking it for anything
        you don't want to share (BRUTE's own exports redact known machine
        identifiers, but double-check).
      render: shell
    validations:
      required: false
